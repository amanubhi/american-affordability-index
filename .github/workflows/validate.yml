name: Reproduce and validate frozen snapshot
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python src/run_pipeline.py --with-story
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node web/test_simulator.cjs
      - run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: verified-analysis
          path: |
            reports/
            visuals/*.png
            output/pdf/
